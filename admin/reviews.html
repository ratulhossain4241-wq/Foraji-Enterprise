<!DOCTYPE html>
<!-- admin/reviews.html — রিভিউ মডারেশন পেজ -->
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রিভিউ — ফরাজী এন্টারপ্রাইজ অ্যাডমিন</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="config.js"></script>

  <link rel="stylesheet" href="css/admin-variables.css" />
  <link rel="stylesheet" href="css/admin-base.css" />
  <link rel="stylesheet" href="css/admin-layout.css" />

  <style>
    /* Reviews পেজ স্পেসিফিক — সেকশন ১১-৬ */
    .reviews-toolbar {
      display: flex;
      gap: var(--space-3);
      margin-bottom: var(--space-5);
      flex-wrap: wrap;
      align-items: center;
    }
    .reviews-toolbar .filter-select {
      min-width: 160px;
    }
    .review-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
      transition: box-shadow var(--transition-fast);
    }
    .review-card:hover {
      box-shadow: var(--shadow-md);
    }
    .review-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    .review-user {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .review-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--brand-gradient);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-sm);
      flex-shrink: 0;
    }
    .review-user-info .review-name {
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
    }
    .review-user-info .review-date {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
    }
    .review-stars {
      display: flex;
      gap: 2px;
      color: var(--warning);
    }
    .review-stars .empty-star {
      color: var(--border-color-strong);
    }
    .review-product {
      font-size: var(--font-size-sm);
      color: var(--brand-primary);
      margin-bottom: var(--space-2);
      font-weight: var(--font-weight-medium);
    }
    .review-text {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      line-height: var(--line-height-relaxed);
      margin-bottom: var(--space-4);
    }
    .review-actions {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .review-status-badge {
      margin-left: auto;
    }
    @media (max-width: 640px) {
      .review-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .review-status-badge {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout-wrapper" id="admin-layout"></div>

  <script type="module" src="js/reviews.js"></script>
</body>
</html>
