<!DOCTYPE html>
<!-- admin/settings.html — শপ সেটিংস পেজ -->
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সেটিংস — ফরাজী এন্টারপ্রাইজ অ্যাডমিন</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="config.js"></script>

  <link rel="stylesheet" href="css/admin-variables.css" />
  <link rel="stylesheet" href="css/admin-base.css" />
  <link rel="stylesheet" href="css/admin-layout.css" />

  <style>
    /* Settings পেজ স্পেসিফিক — সেকশন ১১-৬ */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
      align-items: start;
    }
    @media (max-width: 900px) {
      .settings-grid { grid-template-columns: 1fr; }
    }
    .settings-section {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
    }
    .settings-section h3 {
      font-size: var(--font-size-base);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .settings-section h3 svg {
      color: var(--brand-primary);
    }
    .settings-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: flex-end;
      margin-top: var(--space-5);
    }
    .checkout-preview {
      background: var(--bg-tertiary);
      border: 1px dashed var(--border-color-strong);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-top: var(--space-3);
      font-size: var(--font-size-sm);
    }
    .checkout-preview h4 {
      font-size: var(--font-size-lg);
      color: var(--brand-primary);
      margin-bottom: var(--space-2);
    }
    .checkout-preview p {
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="admin-layout-wrapper" id="admin-layout"></div>

  <script type="module" src="js/settings.js"></script>
</body>
</html>
