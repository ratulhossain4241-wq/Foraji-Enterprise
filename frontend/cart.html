<!DOCTYPE html>
<!-- frontend/cart.html — কার্ট পেজ (সংশোধিত ও পূর্ণাঙ্গ) -->
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>কার্ট — ফরাজী এন্টারপ্রাইজ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Config (সিক্রেট) — সবার আগে -->
  <script src="config.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <style>
    /* Cart Layout — সেকশন ১১-৬ */
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: var(--space-6);
      align-items: start;
    }
    @media (max-width: 900px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }

    .cart-items-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .cart-item {
      display: flex;
      gap: var(--space-4);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      align-items: center;
    }
    @media (max-width: 480px) {
      .cart-item {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .cart-item-image {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-secondary);
    }
    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cart-item-info {
      flex: 1;
      min-width: 0;
    }
    .cart-item-name {
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      margin-bottom: var(--space-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cart-item-code {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-bottom: var(--space-2);
    }
    .cart-item-price {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      flex-shrink: 0;
    }
    @media (max-width: 480px) {
      .cart-item-actions {
        width: 100%;
        justify-content: space-between;
      }
    }

    .cart-item-subtotal {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--brand-primary);
      white-space: nowrap;
      min-width: 80px;
      text-align: right;
    }

    .cart-item-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: var(--space-1);
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }
    .cart-item-remove:hover {
      color: var(--danger);
    }

    /* Cart Summary */
    .cart-summary {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      position: sticky;
      top: calc(var(--header-height) + var(--space-4));
    }
    /* সেকশন ১১(৫): মোবাইলে sticky override */
    @media (max-width: 767px) {
      .cart-summary {
        position: static;
      }
    }
    .cart-summary h3 {
      font-size: var(--font-size-lg);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border-color);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-2) 0;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: var(--space-3) 0;
      margin-top: var(--space-3);
      border-top: 2px solid var(--border-color);
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
    }
    .summary-total .total-amount {
      color: var(--brand-primary);
    }
    .cart-summary .btn {
      margin-top: var(--space-4);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div id="site-header"></div>

  <main class="site-main">
    <div class="container">
      <h1 class="page-title">🛒 আপনার কার্ট</h1>
      <div id="cart-content">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <!-- Checkout Modal (hidden) -->
  <div class="modal-overlay" id="checkout-modal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="checkout-title">
      <button type="button" class="modal-close" id="checkout-close" aria-label="বন্ধ করুন">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="checkout-content"></div>
    </div>
  </div>

  <!-- Confirmation Screen (hidden) -->
  <div class="modal-overlay" id="confirmation-modal">
    <div class="modal-box text-center" role="dialog" aria-modal="true">
      <div id="confirmation-content"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <div class="footer-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>
            <span style="font-weight:700; font-size: var(--font-size-lg);">ফরাজী এন্টারপ্রাইজ</span>
          </div>
          <p class="footer-desc">গ্যাসের চুলা, সিলিন্ডার, স্পেয়ার পার্টস ও রান্নাঘর সামগ্রীর বিশ্বস্ত দোকান। সেরা মানের পণ্য, সাশ্রয়ী মূল্য।</p>
        </div>
        <div>
          <h4 class="footer-title">দ্রুত লিংক</h4>
          <div class="footer-links">
            <a href="index.html">হোম</a>
            <a href="search.html">সব পণ্য</a>
            <a href="category.html">ক্যাটাগরি</a>
            <a href="cart.html">কার্ট</a>
          </div>
        </div>
        <div>
          <h4 class="footer-title">যোগাযোগ</h4>
          <div class="footer-links">
            <a href="#" id="footer-whatsapp-link" target="_blank" rel="noopener">WhatsApp</a>
            <a href="#" id="footer-telegram-link" target="_blank" rel="noopener">Telegram</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        © ২০২৫ ফরাজী এন্টারপ্রাইজ। সর্বস্বত্ব সংরক্ষিত।
      </div>
    </div>
  </footer>

  <script type="module" src="js/cart-page.js"></script>
</body>
  </html>
