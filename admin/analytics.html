<!DOCTYPE html>
<!-- admin/analytics.html — অ্যানালিটিক্স পেজ -->
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>অ্যানালিটিক্স — ফরাজী এন্টারপ্রাইজ অ্যাডমিন</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="config.js"></script>

  <link rel="stylesheet" href="css/admin-variables.css" />
  <link rel="stylesheet" href="css/admin-base.css" />
  <link rel="stylesheet" href="css/admin-layout.css" />

  <style>
    /* Analytics পেজ স্পেসিফিক — সেকশন ১১-৬ */
    .analytics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
    }
    @media (max-width: 900px) {
      .analytics-grid { grid-template-columns: 1fr; }
    }
    .analytics-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
    }
    .analytics-card h3 {
      font-size: var(--font-size-base);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    /* Simple bar chart (CSS-only, no library) */
    .bar-chart {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .bar-label {
      width: 120px;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      text-align: left;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      flex: 1;
      height: 24px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      background: var(--brand-gradient);
      border-radius: var(--radius-sm);
      transition: width var(--transition-slow);
      min-width: 2px;
    }
    .bar-value {
      width: 60px;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      text-align: right;
      flex-shrink: 0;
    }

    /* Status breakdown */
    .status-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-2) 0;
      border-bottom: 1px solid var(--border-color);
    }
    .status-item:last-child {
      border-bottom: none;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-left: var(--space-2);
    }
    .status-dot.pending { background: var(--warning); }
    .status-dot.confirmed { background: var(--info); }
    .status-dot.processing { background: var(--info); }
    .status-dot.shipped { background: var(--info); }
    .status-dot.delivered { background: var(--success); }
    .status-dot.cancelled { background: var(--danger); }

    .status-name {
      flex: 1;
      font-size: var(--font-size-sm);
      color: var(--text-primary);
      display: flex;
      align-items: center;
    }
    .status-count {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
    }
    .status-pct {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      width: 50px;
      text-align: left;
    }

    /* Monthly summary */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: var(--space-3);
    }
    .month-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      text-align: center;
    }
    .month-card .month-name {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-bottom: var(--space-1);
    }
    .month-card .month-orders {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
    }
    .month-card .month-revenue {
      font-size: var(--font-size-xs);
      color: var(--success);
      margin-top: 2px;
    }

    @media (max-width: 640px) {
      .bar-label { width: 80px; font-size: var(--font-size-xs); }
      .bar-value { width: 50px; font-size: var(--font-size-xs); }
    }
  </style>
</head>
<body>
  <div class="admin-layout-wrapper" id="admin-layout"></div>

  <script type="module" src="js/analytics.js"></script>
</body>
</html>
