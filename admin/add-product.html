<!DOCTYPE html>
<!-- admin/add-product.html — নতুন পণ্য যোগ পেজ -->
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>নতুন পণ্য যোগ — ফরাজী এন্টারপ্রাইজ অ্যাডমিন</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="config.js"></script>

  <link rel="stylesheet" href="css/admin-variables.css" />
  <link rel="stylesheet" href="css/admin-base.css" />
  <link rel="stylesheet" href="css/admin-layout.css" />

  <style>
    /* Product Form Specific — সেকশন ১১-৬: same page-এ ডিফাইন */
    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--space-6);
      align-items: start;
    }
    @media (max-width: 900px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
    .form-section {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
    }
    .form-section h3 {
      font-size: var(--font-size-base);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border-color);
    }

    /* Image Upload */
    .image-drop {
      border: 2px dashed var(--border-color-strong);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }
    .image-drop:hover {
      border-color: var(--brand-primary);
      background: var(--bg-secondary);
    }
    .image-drop.dragover {
      border-color: var(--brand-primary);
      background: var(--brand-primary-lighter);
    }
    .image-drop input {
      display: none;
    }
    .image-drop-hint {
      font-size: var(--font-size-sm);
      color: var(--text-tertiary);
      margin-top: var(--space-2);
    }
    .main-image-preview {
      margin-top: var(--space-3);
      position: relative;
      display: inline-block;
    }
    .main-image-preview img {
      max-width: 200px;
      max-height: 200px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .main-image-preview .remove-btn {
      position: absolute;
      top: -8px;
      left: -8px;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: var(--space-3);
      margin-top: var(--space-3);
    }
    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gallery-item .remove-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    /* Tag/Feature Input — সেকশন ১১-২ মেনে re-render নয়, শুধু append */
    .chips-input-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      padding: var(--space-2);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-primary);
      min-height: 42px;
    }
    .chips-input-wrapper:focus-within {
      border-color: var(--border-color-focus);
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      background: var(--brand-primary-lighter);
      color: var(--brand-primary-hover);
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
    }
    .chip button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 0 2px;
      font-size: var(--font-size-sm);
      line-height: 1;
    }
    .chips-input-wrapper input {
      flex: 1;
      min-width: 100px;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-family-base);
      font-size: var(--font-size-sm);
      color: var(--text-primary);
      padding: var(--space-1);
    }

    /* Specifications Rows */
    .spec-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    .spec-row button {
      background: var(--danger-light);
      color: var(--danger);
      border: none;
      border-radius: var(--radius-md);
      padding: 0 var(--space-3);
      cursor: pointer;
    }

    /* Form Actions */
    .form-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: flex-end;
      padding: var(--space-5);
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin-top: var(--space-5);
    }
    @media (max-width: 640px) {
      .form-actions {
        flex-direction: column-reverse;
      }
      .form-actions .btn {
        width: 100%;
      }
    }

    /* Upload spinner overlay */
    .upload-loading {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-tertiary);
      font-size: var(--font-size-sm);
    }
    .upload-loading .spinner {
      width: 16px;
      height: 16px;
      border-width: 2px;
    }
  </style>
</head>
<body>
  <div class="admin-layout-wrapper" id="admin-layout"></div>

  <script type="module" src="js/product-form.js"></script>
</body>
</html>
